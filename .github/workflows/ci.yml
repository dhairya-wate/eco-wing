name: EcoWing Monorepo CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  contracts:
    name: Contracts & Taxonomy Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install validation dependencies
        run: pip install jsonschema pyyaml

      - name: Validate JSON Schemas and Taxonomy
        run: |
          python -c "
          import json, yaml, jsonschema
          from pathlib import Path

          tax_file = Path('contracts/taxonomy.yaml')
          with open(tax_file) as f:
              tax = yaml.safe_load(f)
          assert 'classes' in tax and len(tax['classes']) > 0, 'Invalid taxonomy'
          print(f'Taxonomy valid: {len(tax[\"classes\"])} classes')

          for schema_path in Path('contracts/schemas').glob('*.json'):
              with open(schema_path) as f:
                  s = json.load(f)
              jsonschema.Draft7Validator.check_schema(s)
              print(f'Schema valid: {schema_path.name}')
          "

  node-tests:
    name: Command Center Node Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'services/command-center/package-lock.json'

      - name: Install dependencies
        working-directory: services/command-center
        run: npm ci

      - name: Run Node test runner
        working-directory: services/command-center
        run: npm test

  python-tests:
    name: Sensor & Integration Pytest Suites
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-asyncio anyio jsonschema pyyaml requests httpx fastapi uvicorn websockets numpy ultralytics

      - name: Run Sensor Pytest Suite
        working-directory: services/sensor
        run: pytest -v

      - name: Run Command Center Integration Pytest Suite
        working-directory: services/command-center
        run: pytest test_drone_security.py -v

  secret-scan:
    name: Secret Scan (Gitleaks)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  dependency-audit:
    name: Dependency Audit
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Audit npm packages
        working-directory: services/command-center/backend
        run: npm audit --audit-level=moderate
        continue-on-error: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Audit Python packages
        run: |
          pip install pip-audit
          pip-audit -r services/sensor/requirements.txt
        continue-on-error: true
