services:
  web:
    build:
      context: .
      dockerfile: deploy/nginx/Dockerfile
    ports:
      - "8080:8080"
    environment:
      BACKEND_HOST: backend
      BACKEND_PORT: "3000"
      DETECTION_HOST: host.docker.internal
      DETECTION_PORT: "5000"
      NGINX_ENVSUBST_VARS: "BACKEND_HOST BACKEND_PORT DETECTION_HOST DETECTION_PORT"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - backend
    restart: unless-stopped

  backend:
    build: ./services/command-center
    environment:
      PORT: "3000"
      MONGO_URI: ${MONGO_URI:?MONGO_URI is required}
      ECOWING_OPERATOR_TOKEN: ${ECOWING_OPERATOR_TOKEN:?ECOWING_OPERATOR_TOKEN is required}
      DRONE_DEVICE_TOKENS: ${DRONE_DEVICE_TOKENS:-}
      CORS_ORIGINS: "http://localhost:8080,http://127.0.0.1:8080,http://localhost:3000,http://127.0.0.1:3000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      mongodb:
        condition: service_healthy
    restart: unless-stopped

  mongodb:
    image: mongo:7.0.14-jammy
    command: ["--auth"]
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME:?MONGO_INITDB_ROOT_USERNAME is required}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD:?MONGO_INITDB_ROOT_PASSWORD is required}
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

volumes:
  mongo_data:

