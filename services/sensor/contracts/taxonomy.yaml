taxonomy_version: "1.0.0"
classification_method: "coco_mapping"
description: "Canonical waste taxonomy mapped strictly from supported MS-COCO object classes detected by YOLOv8n."

allowed_property_values:
  material: ["unknown", "plastic", "glass", "metal", "paper", "cardboard", "organic"]
  recyclable: ["yes", "no", "estimated", "depends", "unknown"]
  biodegradable: ["yes", "no", "estimated", "depends", "unknown"]

classes:
  bottle:
    class_id: "bottle"
    display_name: "Bottle"
    coco_label: "bottle"
    category: "Container"
    material: "unknown"
    recyclable: "depends"
    biodegradable: "no"
    reconciled_from: ["plastic_bottle", "glass_bottle", "bottle"]
    notes: "COCO model detects bottle geometry only. Does not classify whether material is PET plastic, glass, or aluminum."

  cup:
    class_id: "cup"
    display_name: "Cup"
    coco_label: "cup"
    category: "Container"
    material: "unknown"
    recyclable: "depends"
    biodegradable: "depends"
    reconciled_from: ["can", "tin", "paper_cup", "plastic_cup", "cup"]
    notes: "COCO model detects cup/mug shapes. May be ceramic, single-use plastic, or wax-coated paper."

  wine_glass:
    class_id: "wine_glass"
    display_name: "Wine Glass / Glassware"
    coco_label: "wine glass"
    category: "Glassware"
    material: "unknown"
    recyclable: "yes"
    biodegradable: "no"
    reconciled_from: ["glass", "wine_glass"]
    notes: "Recyclable glass container."

